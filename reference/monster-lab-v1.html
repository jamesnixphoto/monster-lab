<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Single dark lab world: deep violet-black, voltage yellow accent, cards carry rarity color */
  --bg:#13111b; --panel:#1d1a29; --panel2:#272338; --line:#3b3552;
  --ink:#f2efe7; --muted:#aaa4bd; --accent:#ffcc33; --accent-ink:#1b1600;
  --ok:#74d39a; --warn:#ff8f6b;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--panel)}
header.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;color:var(--accent)}
.brand small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:0}
nav.tabs{display:flex;gap:6px;margin-left:auto}
nav.tabs a{color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid transparent}
nav.tabs a.on{color:var(--ink);border-color:var(--line);background:var(--panel2)}
main{padding:28px 0 80px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 16px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.pill{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.draft{color:var(--accent);border-color:#6b5a1d;background:#2a2410}
.pill.locked{color:var(--ok);border-color:#2f5a40;background:#14261b}
.pill.miss{color:var(--warn);border-color:#6a3526;background:#2a1712}
.pill.pass{color:var(--ok);border-color:#2f5a40;background:#14261b}

/* roster */
.rhead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.rhead p{margin:6px 0 0;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.tile{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.tile .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.newtile{border:2px dashed var(--line);border-radius:16px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);background:transparent}
.newtile b{font-family:var(--display);font-weight:400;color:var(--ink);font-size:20px}

/* card */
/* card: picture fills the card; rarity color is the frame; info sits in slim overlays */
.card{width:18em;aspect-ratio:5/7;border:.08em solid #0b0a10;border-radius:.9em;padding:.34em;position:relative;color:#fff;box-shadow:0 .4em 1.2em rgba(0,0,0,.45);background:var(--rbg);--rc:#4a4658;--rbg:#4a4658;--rink:#fff}
.r-common{--rc:#3e8e3a;--rbg:#3e8e3a}.r-uncommon{--rc:#2d6cd0;--rbg:#2d6cd0}.r-rare{--rc:#7a4fd2;--rbg:#7a4fd2}
.r-legendary{--rc:#e3b324;--rbg:#e3b324;--rink:#2a1f00}.r-mythical{--rc:#c4302e;--rbg:#c4302e}
.r-extreme{--rc:#a33fa8;--rbg:linear-gradient(135deg,#c4302e 0 50%,#7a4fd2 50% 100%)}
.r-divine{--rc:#ec7a18;--rbg:#ec7a18;--rink:#2a1300}
.c-frame{position:relative;width:100%;height:100%;border-radius:.62em;overflow:hidden;background:#0d0c13}
.c-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.c-frame .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.75em;color:#9b96ad;text-align:center;padding:1em}
.c-top{position:absolute;left:0;right:0;top:0;padding:.5em .6em 1.5em;background:linear-gradient(rgba(8,6,14,.88),rgba(8,6,14,0));display:flex;justify-content:space-between;align-items:baseline;gap:.4em}
.c-name{font-family:var(--display);font-size:1.12em;line-height:1.1;overflow-wrap:anywhere;text-shadow:0 .06em .2em rgba(0,0,0,.6)}
.c-meta{font-size:.6em;text-align:right;line-height:1.25;opacity:.95;white-space:nowrap}
.c-moves{position:absolute;left:.4em;bottom:2.5em;display:flex;flex-direction:column;gap:.22em;max-width:64%}
.c-move{background:rgba(8,6,14,.74);border-left:.22em solid var(--rc);border-radius:.3em;padding:.16em .45em;display:flex;align-items:baseline;gap:.45em;font-size:.64em;line-height:1.2}
.c-move span{font-family:var(--display);font-size:1.05em;min-width:2.1em}
.c-move b{font-weight:700;overflow-wrap:anywhere}
.c-bot{position:absolute;left:0;right:0;bottom:0;padding:1.3em .55em .45em;background:linear-gradient(rgba(8,6,14,0),rgba(8,6,14,.9));display:flex;justify-content:space-between;align-items:center;gap:.4em}
.c-hp{font-family:var(--display);font-size:.95em}
.c-hp i{font-style:normal;color:#ff6b7a;margin-right:.2em}
.c-rar{font-family:var(--display);font-size:.56em;letter-spacing:.05em;background:var(--rbg);color:var(--rink);padding:.25em .6em;border-radius:99px}
.c-stamp{position:absolute;bottom:4.6em;right:.7em;font-family:var(--display);font-size:.55em;padding:.12em .5em;border:.14em solid #fff;border-radius:.3em;background:rgba(10,8,16,.7);transform:rotate(6deg)}

/* monster page */
.mhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.mhead h1{font-size:34px}
.back{background:none;border:0;color:var(--muted);padding:0;text-decoration:underline}
.mgrid{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.cardcol{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.side{display:flex;flex-direction:column;gap:18px}
.side h3{font-size:16px;margin-bottom:10px;color:var(--accent)}
.drafts{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.dthumb{flex:0 0 132px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:6px;text-align:left}
.dthumb.on{border-color:var(--accent)}
.dthumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;background:#0d0c13}
.dthumb b{display:block;font-family:var(--display);font-weight:400;font-size:14px;margin-top:6px}
.dthumb small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:2px}
.dadd{flex:0 0 132px;border:2px dashed var(--line);border-radius:12px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:200px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.list{margin:0;padding-left:20px}
.list li{margin:4px 0}
.open li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.open{list-style:none;margin:0;padding:0}
.log{font-size:15px}
.log td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.log td:first-child{white-space:nowrap;color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel2)}
.tag.KEEP{color:var(--ok)}.tag.CHANGE{color:var(--warn)}.tag.ADD{color:var(--accent)}
details summary{cursor:pointer;color:var(--accent);font-family:var(--display);font-size:16px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}

/* quiz */
.quiz{max-width:720px;margin:0 auto}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;color:var(--muted);font-size:15px}
.bar{height:8px;background:var(--panel2);border-radius:99px;margin-bottom:22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.reflect{background:#14261b;border:1px solid #2f5a40;color:var(--ok);border-radius:12px;padding:10px 14px;margin-bottom:18px}
.q{font-family:var(--display);font-size:26px;line-height:1.2;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;text-align:left}
.chip.on{border-color:var(--accent);background:#2a2410;color:var(--accent)}
.chip.wrong{border-color:var(--warn);background:#2a1712;color:var(--warn);text-decoration:line-through}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:8px;border:1px solid rgba(255,255,255,.3)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.field label{color:var(--muted);font-size:15px}
.field input,.field textarea{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.field textarea{min-height:96px;resize:vertical}
.dmg{display:flex;align-items:center;gap:14px;margin-top:8px}
.dmg input[type=range]{flex:1;accent-color:var(--accent)}
.dmg output{font-family:var(--display);font-size:30px;min-width:3.2ch;text-align:right}
.err{color:var(--warn);min-height:24px;margin-top:12px;font-size:15px}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.hint{margin-top:14px;color:var(--muted);font-size:15px}
.dstrip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}
.dstrip figure{margin:0;text-align:center}
.dstrip img{width:110px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:2px solid var(--line);display:block}
.dstrip figure.on img{border-color:var(--accent)}
.dstrip figcaption{font-family:var(--display);font-size:13px;margin-top:4px}
.arrow{color:var(--muted);font-size:22px}
.say{font-size:19px;max-width:60ch}
.say p{margin:0 0 12px}
.review li{margin:6px 0}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,4,10,.72);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:20}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(760px,100%)}
.dlg h2{font-size:22px;margin-bottom:12px}
pre.prompt{background:#0d0c13;border:1px solid var(--line);border-radius:12px;padding:16px;white-space:pre-wrap;font-size:14px;line-height:1.5;overflow-x:auto;max-height:52vh}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:30;max-width:90vw}
.center{text-align:center;padding:60px 0}
.rtable td,.rtable th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.rtable th{color:var(--muted);font-weight:400;font-size:14px}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Monster Lab<small>Grayson's monsters for Monster Brawl</small></div>
  <nav class="tabs" aria-label="Sections">
    <a href="#roster" id="tab-roster">Monsters</a>
    <a href="#rules" id="tab-rules">Rules</a>
  </nav>
</div></header>
<main><div class="wrap" id="app"><p class="center muted">Opening the lab…</p></div></main>
<div id="ov"></div>
<div id="toast" class="toast" hidden></div>

<script>
const TYPES=["Fire","Wind","Poison","Ghost (shadow)","Ice","Food","Water","Ground","Plant","Plasma","Alien","Celestial","Angel","Stormy cloud","Bone","Glitch","Music","Swamp","Sand","Time","Crystal"];
const ADV=[["Water","Fire"],["Fire","Ice"],["Fire","Swamp"],["Sand","Ice"],["Alien","Stormy cloud"],["Ghost (shadow)","Poison"]];
const RAR=[["Common","green","#3e8e3a",500,100],["Uncommon","blue","#2d6cd0",600,200],["Rare","purple","#7a4fd2",700,300],["Legendary","golden yellow","#d9a71c",800,400],["Mythical","red","#c4302e",900,500],["Extreme","red and purple","linear-gradient(135deg,#c4302e 0 50%,#7a4fd2 50% 100%)",1000,600],["Divine","orange","#ec7a18",1100,700]];
const STYLE_BLOCK="Finished in color. Each monster is realistic or cartoony, and the designer picks which one. Cartoony monsters get a thin black cartoon outline. Keep the same shapes and details as the original drawing, with color added and a little shading. Monsters can be any color, and each monster uses the colors the designer picks for it. The overall feel is half dark, half bright. Monsters look scary-ish.";

let db=null, assets=null, monsters=[], loaded=false, loadFail=false, quiz=null, ov=null, viewDraft={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rar=name=>RAR.find(r=>r[0]===name);
const cur=m=>(m.drafts||[])[(m.drafts||[]).length-1];
const getM=id=>monsters.find(m=>m.id===id);
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)}
function route(){const h=location.hash.slice(1);if(h.startsWith("monster-"))return{v:"monster",id:h.slice(8)};if(h==="rules")return{v:"rules"};return{v:"roster"}}

/* ---------- card ---------- */
function card(m,fs,d){
  d=d||cur(m);const r=rar(m.rarity);const cls=r?"r-"+r[0].toLowerCase():"r-none";
  const mv=[0,1,2].map(i=>(m.moves||[])[i]||{});
  const meta=[m.type||"Type ?",m.height||"Height ?"].map(esc).join(" · ");
  const stamp=m.status==="locked"?"":`<div class="c-stamp">${d?"Draft "+d.n:"No draft yet"}</div>`;
  return `<div class="card ${cls}" style="font-size:${fs}px" role="img" aria-label="${esc(m.name)} card"><div class="c-frame">
  ${d&&d.img?`<img src="${esc(d.img)}" alt="${esc(m.name)}, draft ${d.n}">`:`<div class="empty">Add Draft 1:<br>the drawing</div>`}
  <div class="c-top"><span class="c-name">${esc(m.name)}</span><span class="c-meta">${meta}</span></div>${stamp}
  <div class="c-moves">${mv.map(x=>`<div class="c-move"><span class="num">${x.dmg||"?"}</span><b>${esc(x.name||"Move ?")}</b></div>`).join("")}</div>
  <div class="c-bot"><span class="c-hp num"><i aria-hidden="true">♥</i>${r?r[3].toLocaleString():"?"}</span><span class="c-rar">${r?esc(r[0]):"Rarity ?"}</span></div></div></div>`;
}

/* ---------- rules check ---------- */
function checks(m){
  const mv=(m.moves||[]).filter(x=>x&&x.name);
  const badD=(m.moves||[]).filter(x=>x&&x.name&&!(x.dmg>=60&&x.dmg<=300));
  return [
    ["Type is one of the 21",TYPES.includes(m.type),m.type||"not decided"],
    ["Health matches the rarity",!!rar(m.rarity),rar(m.rarity)?`${m.rarity}, ${rar(m.rarity)[3]}`:"rarity not decided"],
    ["Exactly 3 moves",mv.length===3,`${mv.length} of 3`],
    ["Damage 60 to 300",mv.length>0&&badD.length===0,badD.length?badD.map(x=>x.name).join(", ")+" out of range":mv.length?"all in range":"no moves yet"],
    ["Height on the card",!!m.height,m.height||"not decided"],
  ];
}
function gaps(m){
  const g=[];
  if(!m.type)g.push("Type");if(!m.rarity)g.push("Rarity");if(!m.height)g.push("Height");if(!m.territory)g.push("Territory");
  [0,1,2].forEach(i=>{const x=(m.moves||[])[i];if(!x||!x.name||!x.dmg)g.push("Move "+(i+1))});
  if(!m.signature)g.push("The one thing that makes it his");if(!m.expression)g.push("Face");if(!m.look)g.push("Realistic or cartoony");
  return g;
}

/* ---------- views ---------- */
function render(){
  const r=route();
  $("tab-roster").classList.toggle("on",r.v!=="rules");$("tab-rules").classList.toggle("on",r.v==="rules");
  const app=$("app");
  if(!loaded){app.innerHTML=loadFail?`<div class="center"><h2>Can't reach the saved monsters</h2><p class="muted">The lab needs you signed in to claude.ai. Try opening the page again in a minute.</p></div>`:`<p class="center muted">Opening the lab…</p>`;renderOv();return}
  if(quiz){app.innerHTML=quizView();renderOv();return}
  if(r.v==="rules")app.innerHTML=rulesView();
  else if(r.v==="monster"&&getM(r.id))app.innerHTML=monsterView(getM(r.id));
  else app.innerHTML=rosterView();
  renderOv();
}
function rosterView(){
  const list=[...monsters].sort((a,b)=>(a.order??99)-(b.order??99)||a.name.localeCompare(b.name));
  const locked=list.filter(m=>m.status==="locked").length;
  return `<div class="rhead"><div><h1>Grayson's monsters</h1><p class="muted">${list.length} monsters, ${locked} locked, ${list.length-locked} in drafts. Every monster starts at Draft 1 and gets better one draft at a time.</p></div>
  <button class="btn primary" data-act="new">+ New monster</button></div>
  <div class="grid">${list.map(m=>`<button class="tile" data-act="open" data-id="${esc(m.id)}">${card(m,13.5)}<div class="meta"><b>${esc(m.name)}</b><span class="pill ${m.status==="locked"?"locked":"draft"}">${m.status==="locked"?"Locked":"Draft "+((m.drafts||[]).length||0)}</span></div></button>`).join("")}
  <button class="newtile" data-act="new"><b>+ New monster</b><span>Start with his drawing</span></button></div>`;
}
function monsterView(m){
  const ds=m.drafts||[];const sel=viewDraft[m.id]!=null?ds.find(d=>d.n===viewDraft[m.id]):cur(m);
  const ck=checks(m);const g=gaps(m);
  const log=(m.log||[]).slice().reverse();
  return `<div class="mhead"><button class="back" data-act="home">All monsters</button></div>
  <div class="mhead"><h1>${esc(m.name)}</h1><span class="pill ${m.status==="locked"?"locked":"draft"}">${m.status==="locked"?"Locked":"In drafts: Draft "+(ds.length||0)}</span></div>
  <div class="mgrid">
   <div class="cardcol">${card(m,17,sel)}
    <div class="row">
     <button class="btn primary" data-act="quiz" data-id="${esc(m.id)}" ${ds.length?"":"disabled"}>Start a quiz</button>
     <button class="btn" data-act="prompt" data-id="${esc(m.id)}" ${ds.length?"":"disabled"}>Image prompt</button>
    </div>
    <div class="row">
     <button class="btn ghost small" data-act="quizall" data-id="${esc(m.id)}" ${ds.length?"":"disabled"}>Quiz with every question</button>
     ${m.status==="locked"?`<button class="btn ghost small" data-act="unlock" data-id="${esc(m.id)}">Unlock for a new draft</button>`:`<button class="btn ghost small" data-act="lock" data-id="${esc(m.id)}">Lock it (done)</button>`}
    </div>
   </div>
   <div class="side">
    <section class="panel"><h3>Drafts</h3>
     <div class="drafts">${ds.map(d=>`<button class="dthumb ${sel&&sel.n===d.n?"on":""}" data-act="seldraft" data-id="${esc(m.id)}" data-n="${d.n}"><img src="${esc(d.img)}" alt="Draft ${d.n}"><b>Draft ${d.n}</b><small>${esc(d.note||"")}</small></button>`).join("")}
      <button class="dadd" data-act="adddraft" data-id="${esc(m.id)}"><b style="font-size:26px">+</b>Add Draft ${ds.length+1}</button></div>
     ${(m.next||[]).length?`<p class="muted" style="margin:12px 0 4px">For Draft ${ds.length+1}, Grayson asked for:</p><ul class="list">${m.next.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    </section>
    <section class="panel"><h3>Rules check</h3><ul class="checks">${ck.map(([l,ok,d])=>`<li><span>${l}<br><small class="muted">${esc(d)}</small></span><span class="pill ${ok?"pass":"miss"}">${ok?"Pass":"Not yet"}</span></li>`).join("")}</ul></section>
    <section class="panel"><h3>Not decided yet</h3>

  if(all||!m.type)s.push({k:"type"});
  if(all||!m.rarity)s.push({k:"rarity"});
  if(all||!m.height)s.push({k:"height"});
  if(all||!m.territory)s.push({k:"territory"});
  [0,1,2].forEach(i=>{const x=(m.moves||[])[i];if(all||!x||!x.name||!x.dmg)s.push({k:"move",i})});

function answerFor(st,t,m){
  const s=x=>(x||"").trim();
  switch(st.k){
    case"intro":return{};
    case"intake":return{wrong:(t.wrong||[]).map(i=>m.seen.items[i]),missing:s(t.missing)};
    case"like":{const v=[...(t.sel||[])];if(s(t.text))v.push(s(t.text));return v.length?{v}:"Pick something you like, or tap Not decided yet."}
    case"change":if(t.nothing)return{nothing:true};return s(t.text)?{text:s(t.text)}:'Tap "Nothing", or type what to change.';
    case"type":case"rarity":case"look":return t.v?{v:t.v}:"Pick one, or tap Not decided yet.";
    case"height":case"territory":return s(t.text)?{text:s(t.text)}:"Type an answer, or tap Not decided yet.";
    case"move":if(!s(t.name))return"Give the move a name.";if(!t.dmg)return"Pick the damage. Slide or tap the buttons.";return{name:s(t.name),dmg:Math.round(t.dmg)};
    case"signature":case"expression":{const v=s(t.text)||t.v;return v?{v}:"Pick one, or type it."}
    case"color":if(!s(t.part)||!s(t.color))return"Type the part and the color, or tap Not decided yet.";return{part:s(t.part),color:s(t.color)};
  }
}
function reflectFor(st,a){
  if(!a)return"";if(a.skip)return label(st)+": not decided yet.";
  switch(st.k){
    case"intake":return a.wrong.length||a.missing?`Wrong on my list: ${a.wrong.join(", ")||"nothing"}.${a.missing?" Missed: "+a.missing+".":""}`:"My list was right.";
    case"like":return"You like: "+a.v.join(", ")+".";
    case"change":return a.nothing?"Nothing to change.":"Next draft: "+a.text;
    case"type":return"Type: "+a.v+".";
    case"rarity":return`${a.v}, ${rar(a.v)[3].toLocaleString()} health.`;
    case"height":return a.text+" tall.";
    case"territory":return"Territory: "+a.text;
    case"move":return`Move ${st.i+1}: ${a.name}, ${a.dmg} damage.`;
    case"signature":return"What makes it yours: "+a.v;
    case"expression":return"Face: "+a.v.toLowerCase()+".";
    case"look":return a.v+".";
    case"color":return`${a.part}: ${a.color}.`;
  }
  return"";
}
function label(st){return{intake:"My list",like:"What you like",change:"Next draft",type:"Type",rarity:"Rarity",height:"Height",territory:"Territory",signature:"What makes it yours",expression:"Face",look:"Realistic or cartoony",color:"New color"}[st.k]||("Move "+(st.i+1))}

async function saveQuiz(){
  const m=JSON.parse(JSON.stringify(getM(quiz.id)));const d=cur(m).n;const who="Grayson";
  m.log=m.log||[];m.colors=m.colors||[];m.moves=m.moves||[{},{},{}];m.next=m.next||[];
  const L=(kind,text)=>m.log.push({draft:d,kind,text,who});
  for(const st of quiz.steps){const a=quiz.a[key(st)];if(!a||a.skip)continue;
    switch(st.k){
      case"intake":a.wrong.forEach(w=>L("CHANGE",`Marked wrong on the list: ${w}`));if(a.missing){L("ADD",`Missed on the list: ${a.missing}`)}
        m.seen.checked=true;m.parts=(m.parts||[]).filter(p=>!a.wrong.includes(p));if(a.missing)m.parts.push(a.missing);break;
      case"like":L("KEEP","Likes: "+a.v.join(", "));break;
      case"change":if(a.nothing)L("KEEP",`Nothing to change in Draft ${d}`);else{L("CHANGE",`For the next draft: ${a.text}`);m.next.push(a.text)}break;
      case"type":L(m.type?"CHANGE":"ADD","Type: "+a.v);m.type=a.v;break;
      case"rarity":L(m.rarity?"CHANGE":"ADD",`Rarity: ${a.v}, ${rar(a.v)[3]} health`);m.rarity=a.v;break;
      case"height":L(m.height?"CHANGE":"ADD","Height: "+a.text);m.height=a.text;break;
      case"territory":L(m.territory?"CHANGE":"ADD","Territory: "+a.text);m.territory=a.text;break;
      case"move":L(m.moves[st.i]&&m.moves[st.i].name?"CHANGE":"ADD",`Move ${st.i+1}: ${a.name}, ${a.dmg}`);m.moves[st.i]={name:a.name,dmg:a.dmg};break;
      case"signature":L(m.signature?"CHANGE":"ADD","What makes it his: "+a.v);m.signature=a.v;break;
      case"expression":L(m.expression?"CHANGE":"ADD","Face: "+a.v);m.expression=a.v;break;
      case"look":L(m.look?"CHANGE":"ADD","Style: "+a.v);m.look=a.v;break;
      case"color":{const i=m.colors.findIndex(c=>c.part.toLowerCase()===a.part.toLowerCase());L(i>=0?"CHANGE":"ADD",`Color: ${a.part}, ${a.color}`);if(i>=0)m.colors[i].color=a.color;else m.colors.push({part:a.part,color:a.color});break}
    }}
  if(await save(m)){const id=quiz.id;quiz=null;toast(`Saved to ${m.name}'s file.`);location.hash="monster-"+id;render();window.scrollTo(0,0)}
}

/* ---------- prompt ---------- */
function buildPrompt(m){
  if(m.prompt&&m.prompt.forDraft===cur(m).n)return m.prompt;
  const look=(m.look||"cartoony").toLowerCase();
  const parts=[`${m.name}${m.expression?", "+m.expression.toLowerCase():""}.`];
  if(m.signature)parts.push(`Signature feature: "${m.signature}".`);
  (m.colors||[]).forEach(c=>parts.push(`${c.part}: ${c.color}.`));
  const avoid=[look==="realistic"?"No cartoon outline. Realistic, with shading.":"No glossy 3D render. Thin black outline with a little shading.",
    "No new parts or reshaped parts. Keep the drawing's shapes and details.","No card border, text or numbers. The monster picture only."];
  (m.next||[]).forEach(x=>avoid.splice(1,0,`Change for this draft: ${x}`));
  return{version:"built from answers",subject:parts.join(" "),composition:"3:4 portrait. Full body, centered, front-facing. Plain dark background.",avoid};
}
function promptText(m){const p=buildPrompt(m);return `STYLE BLOCK\n${STYLE_BLOCK}\nThis monster is: ${(m.look||"not decided").toLowerCase()}\n\nSUBJECT\n${p.subject}\n\nCOMPOSITION\n${p.composition}\n\nAVOID\n${p.avoid.map(x=>"- "+x).join("\n")}`}
const wc=s=>s.trim().split(/\s+/).filter(Boolean).length;

    h=`<h2>Lock ${esc(m.name)}?</h2><p>Locked means Grayson says it's done. The card loses its draft stamp and counts as finished in the roster. You can unlock it later for a new draft.</p>
    ${miss.length?`<p class="muted">Rules not passed yet: ${miss.map(c=>c[0]).join(", ")}.</p>`:""}
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">Not yet</button><button class="btn primary" data-act="dolock">Lock it</button></div>`}
  el.innerHTML=`<div class="ov" data-act="ovbg"><div class="dlg" role="dialog" aria-modal="true">${h}</div></div>`;
  const f=el.querySelector("input:not([type=file])");if(f&&ov.k==="new")f.focus();
}

/* ---------- saving ---------- */
async function save(m){
  const i=monsters.findIndex(x=>x.id===m.id);const copy=JSON.parse(JSON.stringify(m));const id=copy.id;delete copy.id;copy.updated=new Date().toISOString();
  if(!db){toast("Saving needs you signed in to claude.ai.");return false}
  try{await db.collection("monsters").doc(id).set(copy);if(i>=0)monsters[i]={...copy,id};else monsters.push({...copy,id});return true}
  catch(e){toast(e&&e.code==="invalid_argument"?"This account can look but can't save.":"Couldn't save. Try again in a moment.");return false}
}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"monster";

/* ---------- events ---------- */
document.addEventListener("input",e=>{
  const b=e.target.dataset&&e.target.dataset.bind;if(!b||!quiz)return;
  quiz.t[b]=b==="dmg"?+e.target.value:e.target.value;
  if(b==="dmg"){$("o-md").textContent=e.target.value}
  if(b==="text"&&["signature","expression"].includes(quiz.steps[quiz.i].k)&&e.target.value&&quiz.t.v){quiz.t.v="";document.querySelectorAll('[data-act="tv"].on').forEach(c=>{c.classList.remove("on");c.setAttribute("aria-pressed","false")})}
  if(b==="text"&&quiz.steps[quiz.i].k==="change"&&e.target.value&&quiz.t.nothing){quiz.t.nothing=false;const c=document.querySelector('[data-act="tnothing"]');if(c){c.classList.remove("on");c.setAttribute("aria-pressed","false")}}
  const er=$("qerr");if(er)er.textContent="";
});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(a==="ovbg"&&e.target!==el)return;
  const id=el.dataset.id;
  switch(a){
    case"open":location.hash="monster-"+id;break;
    case"home":location.hash="roster";break;
    case"new":ov={k:"new"};renderOv();break;
    case"close":case"ovbg":ov=null;renderOv();break;
    case"seldraft":viewDraft[id]=+el.dataset.n;render();break;
    case"quiz":startQuiz(getM(id),false);break;
    case"quizall":startQuiz(getM(id),true);break;
    case"prompt":ov={k:"prompt",id};renderOv();break;
    case"adddraft":ov={k:"draft",id};renderOv();break;
    case"lock":ov={k:"lock",id};renderOv();break;
    case"dolock":{const m=JSON.parse(JSON.stringify(getM(ov.id)));m.status="locked";m.log=m.log||[];m.log.push({draft:cur(m)?cur(m).n:0,kind:"KEEP",text:"Locked. Grayson says it's done.",who:"Grayson"});if(await save(m)){ov=null;render();toast(m.name+" is locked.")}break}
    case"unlock":{const m=JSON.parse(JSON.stringify(getM(id)));m.status="draft";if(await save(m)){render();toast(m.name+" is open for a new draft.")}break}
    case"closeopen":{const m=JSON.parse(JSON.stringify(getM(id)));m.open.splice(+el.dataset.i,1);if(await save(m))render();break}
    case"copy":{const txt=promptText(getM(ov.id));try{await navigator.clipboard.writeText(txt);toast("Prompt copied.")}catch(_){const r=document.createRange();r.selectNodeContents($("ptext"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Press Cmd+C to copy.")}break}
    case"create":{const name=$("f-nn").value.trim();if(!name){$("oerr").textContent="Type a name first.";return}
      let sid=slug(name),k=2;while(getM(sid))sid=slug(name)+"-"+k++;
      const m={id:sid,name,status:"draft",order:monsters.length+1,drafts:[],parts:[],colors:[],moves:[{},{},{}],log:[],next:[],open:[]};
      if(await save(m)){ov={k:"draft",id:sid};location.hash="monster-"+sid}break}
    case"savedraft":{const f=$("f-file").files[0];if(!f){$("oerr").textContent="Pick a picture first.";return}
      if(!assets){$("oerr").textContent="Adding pictures needs editor access on this page.";return}
      el.disabled=true;el.textContent="Uploading…";
      try{const up=await assets.upload(f);const m=JSON.parse(JSON.stringify(getM(ov.id)));const n=(m.drafts||[]).length+1;
        m.drafts=m.drafts||[];m.drafts.push({n,img:up.url||("/_blob/"+up.id),asset:up.id,note:$("f-note").value.trim()||(n===1?"Grayson's drawing":"New draft"),by:n===1?"Grayson":"Image tool"});
        m.log=m.log||[];(m.next||[]).forEach(x=>m.log.push({draft:n,kind:"CHANGE",text:"Asked for in this draft: "+x,who:"Grayson"}));m.next=[];
        m.seen={n,items:[],checked:true};
        if(await save(m)){ov=null;viewDraft[m.id]=null;render();toast(`Draft ${n} added.`)}}
      catch(_){$("oerr").textContent="The upload didn't work. Try a smaller picture.";el.disabled=false;el.textContent="Try again"}break}
    case"tw":{const i=+el.dataset.i;const w=quiz.t.wrong;const j=w.indexOf(i);j>=0?w.splice(j,1):w.push(i);render();break}
    case"tsel":{const v=el.dataset.v;const s=quiz.t.sel;const j=s.indexOf(v);j>=0?s.splice(j,1):s.push(v);render();break}
    case"tv":quiz.t.v=quiz.t.v===el.dataset.v?"":el.dataset.v;if(["signature","expression"].includes(quiz.steps[quiz.i].k)&&quiz.t.v)quiz.t.text="";render();break;
    case"tnothing":quiz.t.nothing=!quiz.t.nothing;if(quiz.t.nothing)quiz.t.text="";render();break;
    case"dmgstep":{const v=Math.max(60,Math.min(300,(quiz.t.dmg||180)+ +el.dataset.d));quiz.t.dmg=v;$("f-md").value=v;$("o-md").textContent=v;break}
    case"qnext":{const st=quiz.steps[quiz.i];if(st.k==="review"){el.disabled=true;await saveQuiz();return}
      const ans=answerFor(st,quiz.t,getM(quiz.id));if(typeof ans==="string"){$("qerr").textContent=ans;return}
      quiz.a[key(st)]=ans;quiz.reflect=st.k==="intro"?"":"Got it. "+reflectFor(st,ans);quiz.i++;loadT();render();window.scrollTo(0,0);break}
    case"qskip":{const st=quiz.steps[quiz.i];quiz.a[key(st)]={skip:true};quiz.reflect="Got it. "+label(st)+": not decided yet.";quiz.i++;loadT();render();window.scrollTo(0,0);break}
    case"qback":if(quiz.i===0){quiz=null;render()}else{quiz.i--;quiz.reflect="";loadT();render()}break;
    case"qexit":quiz=null;render();toast("Stopped. Nothing from this quiz was saved.");break;
  }
});
addEventListener("hashchange",()=>{quiz=null;render();window.scrollTo(0,0)});
addEventListener("keydown",e=>{if(e.key==="Escape"&&ov){ov=null;renderOv()}});

/* ---------- boot ---------- */
render();
(async()=>{
  const timer=setTimeout(()=>{if(!loaded){loadFail=true;render()}},10000);
  if(!window.claude||!claude.use){clearTimeout(timer);loadFail=true;render();return}
  claude.use("assets").then(a=>{assets=a}).catch(()=>{});
  try{db=await claude.use("db")}catch(_){db=null}
  if(!db){clearTimeout(timer);loadFail=true;render();return}
  db.collection("monsters").onSnapshot(snap=>{
    monsters=snap.docs.map(d=>({...JSON.parse(JSON.stringify(d.data())),id:d.id}));
    if(!snap.metadata.fromCache){clearTimeout(timer)}
    loaded=true;loadFail=false;
    if(!quiz&&!ov)render();
  },err=>{clearTimeout(timer);if(!loaded){loadFail=true;render()}else toast("Lost the connection to saved monsters.")});
})();
</script>
</body>
</html>
